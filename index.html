<!DOCTYPE html>
<html lang="en" class="h-full select-none">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify Web Player: Music for everyone</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts (Inter) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        spotify: {
                            green: '#1DB954',
                            'green-hover': '#1ed760',
                            black: '#000000',
                            dark: '#121212',
                            card: '#181818',
                            'card-hover': '#282828',
                            light: '#242424',
                            gray: '#b3b3b3',
                            'gray-light': '#a7a7a7'
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif']
                    }
                }
            }
        }
    </script>

    <style>
        /* Custom Scrollbars */
        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.3);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: rgba(255, 255, 255, 0.5);
        }

        /* Range Sliders */
        input[type="range"] {
            -webkit-appearance: none;
            background: transparent;
        }
        input[type="range"]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: #4d4d4d;
            border-radius: 2px;
        }
        input[type="range"]::-webkit-slider-thumb {
            height: 12px;
            width: 12px;
            border-radius: 50%;
            background: #ffffff;
            cursor: pointer;
            -webkit-appearance: none;
            margin-top: -4px;
            opacity: 0;
            transition: opacity 0.15s ease-in-out;
        }
        .group:hover input[type="range"]::-webkit-slider-thumb,
        input[type="range"]:focus::-webkit-slider-thumb,
        input[type="range"]:active::-webkit-slider-thumb {
            opacity: 1;
        }
        .progress-fill {
            height: 4px;
            background-color: #ffffff;
            border-radius: 2px;
        }
        .group:hover .progress-fill {
            background-color: #1DB954;
        }

        /* Card Hover Play Button Effect */
        .card-play-btn {
            opacity: 0;
            transform: translateY(8px);
            transition: all 0.3s ease;
        }
        .music-card:hover .card-play-btn {
            opacity: 1;
            transform: translateY(0);
        }

        /* Gradient Overlays */
        .header-gradient {
            background: linear-gradient(to bottom, rgba(18, 18, 18, 0.8) 0%, #121212 100%);
        }
    </style>
</head>
<body class="bg-spotify-black text-white font-sans h-full overflow-hidden flex flex-col antialiased">

    <!-- App Container -->
    <div class="flex-1 flex overflow-hidden p-2 gap-2">
        
        <!-- Sidebar Navigation -->
        <aside id="sidebar" class="w-64 bg-spotify-black flex flex-col gap-2 shrink-0 transition-all duration-300 z-20">
            <!-- Top Nav Box -->
            <div class="bg-spotify-dark rounded-lg p-4 space-y-4">
                <div class="flex items-center gap-2 px-2 text-white font-bold text-xl cursor-pointer" onclick="navigateTo('home')">
                    <i class="fa-brands fa-spotify text-3xl text-spotify-green"></i>
                    <span>Spotify</span>
                </div>
                <nav class="space-y-1">
                    <button onclick="navigateTo('home')" id="nav-home" class="nav-item flex items-center gap-4 text-white font-semibold py-2 px-3 rounded-md hover:text-white transition w-full text-left">
                        <i class="fa-solid fa-house text-xl"></i>
                        <span>Home</span>
                    </button>
                    <button onclick="navigateTo('search')" id="nav-search" class="nav-item flex items-center gap-4 text-spotify-gray font-semibold py-2 px-3 rounded-md hover:text-white transition w-full text-left">
                        <i class="fa-solid fa-magnifying-glass text-xl"></i>
                        <span>Search</span>
                    </button>
                </nav>
            </div>

            <!-- Library Box -->
            <div class="bg-spotify-dark rounded-lg p-4 flex-1 flex flex-col min-h-0">
                <div class="flex items-center justify-between text-spotify-gray mb-4 px-2">
                    <button onclick="navigateTo('library')" class="flex items-center gap-3 font-semibold hover:text-white transition">
                        <i class="fa-solid fa-book-bookmark text-xl"></i>
                        <span>Your Library</span>
                    </button>
                    <div class="flex items-center gap-2">
                        <button onclick="openCreatePlaylistModal()" title="Create Playlist" class="hover:text-white p-1 rounded-full hover:bg-spotify-light transition">
                            <i class="fa-solid fa-plus"></i>
                        </button>
                    </div>
                </div>

                <!-- Playlist Quick Tabs -->
                <div class="flex gap-2 mb-3">
                    <span class="bg-spotify-light text-xs text-white font-medium px-3 py-1.5 rounded-full cursor-pointer hover:bg-[#333] transition">Playlists</span>
                    <span class="bg-spotify-light text-xs text-white font-medium px-3 py-1.5 rounded-full cursor-pointer hover:bg-[#333] transition">Artists</span>
                </div>

                <!-- Library Items List -->
                <div id="library-list" class="flex-1 overflow-y-auto space-y-1 pr-1">
                    <!-- Dynamic Library Items Injected Here -->
                </div>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="flex-1 bg-spotify-dark rounded-lg flex flex-col overflow-hidden relative">
            
            <!-- Top Header Bar -->
            <header class="h-16 px-6 flex items-center justify-between bg-opacity-80 backdrop-blur-md sticky top-0 z-10 transition-colors duration-300" id="top-header">
                <div class="flex items-center gap-4 flex-1">
                    <div class="flex items-center gap-2">
                        <button onclick="historyBack()" class="w-8 h-8 rounded-full bg-black/60 flex items-center justify-center text-spotify-gray hover:text-white transition">
                            <i class="fa-solid fa-chevron-left"></i>
                        </button>
                        <button onclick="historyForward()" class="w-8 h-8 rounded-full bg-black/60 flex items-center justify-center text-spotify-gray hover:text-white transition">
                            <i class="fa-solid fa-chevron-right"></i>
                        </button>
                    </div>

                    <!-- Search Input (Visible on Search Page) -->
                    <div id="header-search-container" class="hidden relative max-w-md w-full">
                        <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-spotify-gray"></i>
                        <input type="text" id="search-input" placeholder="What do you want to listen to?" 
                            class="w-full bg-spotify-light text-white placeholder-spotify-gray text-sm rounded-full pl-10 pr-10 py-2.5 focus:outline-none focus:ring-2 focus:ring-white">
                        <button id="clear-search" class="hidden absolute right-3 top-1/2 -translate-y-1/2 text-spotify-gray hover:text-white">
                            <i class="fa-solid fa-xmark"></i>
                        </button>
                    </div>
                </div>

                <!-- Profile / Auth Buttons -->
                <div class="flex items-center gap-4">
                    <a href="https://spotify.com" target="_blank" class="hidden md:inline-block bg-white text-black text-sm font-bold px-4 py-2 rounded-full hover:scale-105 transition transform">Explore Premium</a>
                    <button class="bg-black/60 text-white font-semibold text-sm px-3 py-1.5 rounded-full flex items-center gap-2 hover:scale-105 transition">
                        <i class="fa-regular fa-circle-down"></i>
                        <span class="hidden sm:inline">Install App</span>
                    </button>
                    <div class="relative group">
                        <button class="w-9 h-9 rounded-full bg-spotify-green text-black font-bold flex items-center justify-center border-2 border-transparent hover:scale-105 transition">
                            U
                        </button>
                    </div>
                </div>
            </header>

            <!-- Scrollable View Container -->
            <div id="main-view" class="flex-1 overflow-y-auto pb-12">
                <!-- Page contents (Home, Search, Playlist Detail, Liked Songs) will render dynamically here -->
            </div>
        </main>
    </div>

    <!-- Bottom Audio Player Bar -->
    <footer class="h-20 bg-spotify-black border-t border-spotify-dark/50 px-4 flex items-center justify-between gap-4 z-30 shrink-0">
        <!-- Currently Playing Track Details -->
        <div class="flex items-center gap-3 w-1/4 min-w-[180px]">
            <img id="player-thumb" src="https://images.unsplash.com/photo-1614613535308-eb5fbd3d2c17?w=100&h=100&fit=crop" alt="Track Cover" class="w-14 h-14 rounded object-cover shadow">
            <div class="overflow-hidden">
                <div id="player-title" class="text-sm text-white font-medium truncate hover:underline cursor-pointer">Select a song</div>
                <div id="player-artist" class="text-xs text-spotify-gray truncate hover:underline cursor-pointer">Spotify Clone</div>
            </div>
            <button id="player-like-btn" onclick="toggleCurrentSongLike()" class="text-spotify-gray hover:text-white transition ml-2">
                <i class="fa-regular fa-heart"></i>
            </button>
        </div>

        <!-- Center Player Controls & Progress -->
        <div class="flex flex-col items-center gap-1.5 w-2/4 max-w-[600px]">
            <!-- Action Buttons -->
            <div class="flex items-center gap-5">
                <button id="shuffle-btn" onclick="toggleShuffle()" class="text-spotify-gray hover:text-white transition text-sm" title="Enable shuffle">
                    <i class="fa-solid fa-shuffle"></i>
                </button>
                <button onclick="prevTrack()" class="text-spotify-gray hover:text-white transition text-base">
                    <i class="fa-solid fa-backward-step"></i>
                </button>
                <button id="play-pause-btn" onclick="togglePlayPause()" class="w-8 h-8 rounded-full bg-white text-black flex items-center justify-center hover:scale-105 transition">
                    <i class="fa-solid fa-play text-sm ml-0.5"></i>
                </button>
                <button onclick="nextTrack()" class="text-spotify-gray hover:text-white transition text-base">
                    <i class="fa-solid fa-forward-step"></i>
                </button>
                <button id="repeat-btn" onclick="toggleRepeat()" class="text-spotify-gray hover:text-white transition text-sm" title="Enable repeat">
                    <i class="fa-solid fa-repeat"></i>
                </button>
            </div>

            <!-- Progress Bar -->
            <div class="w-full flex items-center gap-2 group">
                <span id="current-time" class="text-xs text-spotify-gray w-8 text-right font-mono">0:00</span>
                <div class="relative flex-1 flex items-center h-2 cursor-pointer" id="progress-container">
                    <div class="absolute w-full h-1 bg-spotify-light rounded-full"></div>
                    <div id="progress-bar-fill" class="absolute h-1 bg-white group-hover:bg-spotify-green rounded-full w-0"></div>
                    <input type="range" id="seek-slider" min="0" max="100" value="0" class="w-full z-10 opacity-0 cursor-pointer">
                </div>
                <span id="total-time" class="text-xs text-spotify-gray w-8 font-mono">0:00</span>
            </div>
        </div>

        <!-- Right Side Volume & Auxiliary Controls -->
        <div class="flex items-center justify-end gap-3 w-1/4 min-w-[180px]">
            <button onclick="navigateTo('library')" class="text-spotify-gray hover:text-white transition text-xs" title="Queue">
                <i class="fa-solid fa-list-ul"></i>
            </button>
            <div class="flex items-center gap-2 group w-28">
                <button id="mute-btn" onclick="toggleMute()" class="text-spotify-gray hover:text-white transition">
                    <i class="fa-solid fa-volume-high text-xs"></i>
                </button>
                <div class="relative flex-1 flex items-center h-2">
                    <div class="absolute w-full h-1 bg-spotify-light rounded-full"></div>
                    <div id="volume-bar-fill" class="absolute h-1 bg-white group-hover:bg-spotify-green rounded-full w-3/4"></div>
                    <input type="range" id="volume-slider" min="0" max="100" value="75" class="w-full z-10 opacity-0 cursor-pointer">
                </div>
            </div>
        </div>
    </footer>

    <!-- Create Playlist Modal -->
    <div id="playlist-modal" class="fixed inset-0 bg-black/70 z-50 flex items-center justify-center hidden backdrop-blur-sm">
        <div class="bg-spotify-dark p-6 rounded-xl w-full max-w-md border border-spotify-light shadow-2xl">
            <div class="flex justify-between items-center mb-4">
                <h3 class="text-xl font-bold text-white">Create New Playlist</h3>
                <button onclick="closeCreatePlaylistModal()" class="text-spotify-gray hover:text-white">
                    <i class="fa-solid fa-xmark text-xl"></i>
                </button>
            </div>
            <form id="create-playlist-form" onsubmit="handleCreatePlaylist(event)">
                <div class="space-y-4">
                    <div>
                        <label class="block text-xs font-semibold text-spotify-gray uppercase mb-1">Playlist Name</label>
                        <input type="text" id="playlist-name-input" required placeholder="My Awesome Playlist" 
                            class="w-full bg-spotify-light text-white rounded p-3 text-sm focus:outline-none focus:ring-2 focus:ring-spotify-green">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-spotify-gray uppercase mb-1">Description</label>
                        <textarea id="playlist-desc-input" rows="2" placeholder="Give your playlist a cool description..." 
                            class="w-full bg-spotify-light text-white rounded p-3 text-sm focus:outline-none focus:ring-2 focus:ring-spotify-green resize-none"></textarea>
                    </div>
                </div>
                <div class="flex justify-end gap-3 mt-6">
                    <button type="button" onclick="closeCreatePlaylistModal()" class="px-5 py-2 rounded-full text-sm font-semibold hover:scale-105 transition">Cancel</button>
                    <button type="submit" class="bg-spotify-green text-black font-bold px-6 py-2 rounded-full hover:scale-105 transition">Create</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Toast Notification Overlay -->
    <div id="toast" class="fixed bottom-24 left-1/2 -translate-x-1/2 bg-spotify-green text-black px-6 py-2.5 rounded-full font-semibold text-sm shadow-xl opacity-0 pointer-events-none transition-opacity duration-300 z-50 flex items-center gap-2">
        <i class="fa-solid fa-circle-check"></i>
        <span id="toast-message">Notification</span>
    </div>

    <!-- Main JavaScript Logic -->
    <script>
        /* ==========================================
           1. DATA STORE (Music, Playlists, Categories)
           ========================================== */
        
        // Sample Audio Tracks (Using reliable royalty-free music streams)
        const mockTracks = [
            {
                id: 't1',

                audioUrl: 'https://cdn.pixabay.com/download/audio/2022/03/15/audio_c8c8a73467.mp3?filename=creative-technology-14388.mp3'
            },
            {
                id: 't3',
                title: 'Electric Euphoria',

            },
            {
                id: 't4',

                audioUrl: 'https://cdn.pixabay.com/download/audio/2022/10/14/audio_9939f792cb.mp3?filename=stomping-rock-122848.mp3'
            },
            {
                id: 't5',
                title: 'Deep Focus Ambient',
                artist: 'Mindfulness Sound',
                album: 'Flow State',
                duration: '2:50',
                durationSec: 170,
                cover: 'https://images.unsplash.com/photo-1519681393784-d120267933ba?w=300&h=300&fit=crop',
                audioUrl: 'https://cdn.pixabay.com/download/audio/2022/02/10/audio_fc80249764.mp3?filename=soft-ambient-10651.mp3'
            },
            {
                id: 't6',
                title: 'Cyberpunk Odyssey',
                artist: 'Pixel Overdrive',
                album: 'Retrofuturism',
                duration: '2:05',
                durationSec: 125,
                cover: 'https://images.unsplash.com/photo-1508700115892-45ecd05ae2ad?w=300&h=300&fit=crop',
                audioUrl: 'https://cdn.pixabay.com/download/audio/2022/03/10/audio_c2f829f086.mp3?filename=energy-action-10620.mp3'
            }
        ];

        // Sample Playlists & Featured Collections
        let playlists = [
            {
                id: 'p1',
                name: 'Today\'s Top Hits',
                description: 'The hottest tracks right now across the globe.',
                cover: 'https://images.unsplash.com/photo-1470225620780-dba8ba36b745?w=400&h=400&fit=crop',
                tracks: ['t1', 't3', 't6', 't4']
            },
            {
                id: 'p2',
                name: 'Chill Lofi Study Beats',
                description: 'Peaceful instrumental beats to help you focus and study.',
                cover: 'https://images.unsplash.com/photo-1518709268805-4e9042af9f23?w=400&h=400&fit=crop',
                tracks: ['t2', 't5']
            },
            {
                id: 'p3',
                name: 'Rock Classics',
                description: 'Timeless anthem riffs and high energy hits.',
                cover: 'https://images.unsplash.com/photo-1498038432885-c6f3f1b912ee?w=400&h=400&fit=crop',
                tracks: ['t4', 't3']
            },
            {
                id: 'p4',
                name: 'Deep Focus & Coding',
                description: 'Keep calm and code on with steady electronic rhythm.',
                cover: 'https://images.unsplash.com/photo-1519681393784-d120267933ba?w=400&h=400&fit=crop',
                tracks: ['t5', 't1', 't2']
            }
        ];

        // Search Genre Categories
        const searchCategories = [
            { name: 'Pop', color: 'bg-pink-600', img: 'https://images.unsplash.com/photo-1514525253161-7a46d19cd819?w=200&h=200&fit=crop' },
            { name: 'Hip-Hop', color: 'bg-orange-600', img: 'https://images.unsplash.com/photo-1509198397868-475647b2a1e5?w=200&h=200&fit=crop' },
            { name: 'Rock', color: 'bg-red-600', img: 'https://images.unsplash.com/photo-1498038432885-c6f3f1b912ee?w=200&h=200&fit=crop' },
            { name: 'Chill', color: 'bg-teal-600', img: 'https://images.unsplash.com/photo-1507525428034-b723cf961d3e?w=200&h=200&fit=crop' },
            { name: 'Indie', color: 'bg-indigo-600', img: 'https://images.unsplash.com/photo-1465847899084-d164df4dedc6?w=200&h=200&fit=crop' },
            { name: 'Gaming', color: 'bg-purple-600', img: 'https://images.unsplash.com/photo-1538481199705-c710c4e965fc?w=200&h=200&fit=crop' }
        ];

        /* ==========================================
           2. STATE MANAGEMENT
           ========================================== */
        const state = {
            currentView: 'home', // home, search, library, playlist, liked
            selectedPlaylistId: null,
            likedSongIds: new Set(['t1', 't4']),
            currentTrackIndex: 0,
            activeQueue: [...mockTracks],
            isPlaying: false,
            isShuffle: false,
            isRepeat: false,
            isMuted: false,
            volume: 0.75,
            history: ['home'],
            historyIndex: 0
        };

        // Audio API instance
        const audio = new Audio();
        audio.volume = state.volume;

        /* ==========================================
           3. INITIALIZATION & ROUTING
           ========================================== */
        window.addEventListener('DOMContentLoaded', () => {
            renderSidebarLibrary();
            navigateTo('home', false);
            setupAudioEventListeners();
            setupInputControls();
        });

        function navigateTo(view, pushHistory = true, playlistId = null) {
            state.currentView = view;
            if (playlistId) state.selectedPlaylistId = playlistId;

            // Update Browser History Stack
            if (pushHistory) {
                state.history = state.history.slice(0, state.historyIndex + 1);
                state.history.push({ view, playlistId });
                state.historyIndex = state.history.length - 1;
            }

            // Navigation UI updates
            document.querySelectorAll('.nav-item').forEach(el => {
                el.classList.remove('text-white', 'bg-spotify-light');
                el.classList.add('text-spotify-gray');
            });

            const activeNav = document.getElementById(`nav-${view}`);
            if (activeNav) {
                activeNav.classList.remove('text-spotify-gray');
                activeNav.classList.add('text-white');
            }

            // Search Bar header visibility
            const searchContainer = document.getElementById('header-search-container');
            if (view === 'search') {
                searchContainer.classList.remove('hidden');
                document.getElementById('search-input').focus();
            } else {
                searchContainer.classList.add('hidden');
            }

            // Render view contents
            const mainView = document.getElementById('main-view');
            switch (view) {
                case 'home':
                    mainView.innerHTML = renderHomeView();
                    break;
                case 'search':
                    mainView.innerHTML = renderSearchView();
                    setupSearchInputListener();
                    break;
                case 'library':
                    mainView.innerHTML = renderLibraryView();
                    break;
                case 'playlist':
                    mainView.innerHTML = renderPlaylistDetailView(state.selectedPlaylistId);
                    break;
                case 'liked':
                    mainView.innerHTML = renderLikedSongsView();
                    break;
            }
        }

        function historyBack() {
            if (state.historyIndex > 0) {
                state.historyIndex--;
                const item = state.history[state.historyIndex];
                navigateTo(item.view, false, item.playlistId);
            }
        }

        function historyForward() {
            if (state.historyIndex < state.history.length - 1) {
                state.historyIndex++;
                const item = state.history[state.historyIndex];
                navigateTo(item.view, false, item.playlistId);
            }
        }

        /* ==========================================
           4. VIEW RENDERERS
           ========================================== */
        
        // Home View HTML
        function renderHomeView() {
            return `
                <div class="p-6 space-y-8">
                    <!-- Greeting Header -->
                    <div>
                        <h1 class="text-3xl font-bold tracking-tight mb-4">Good afternoon</h1>
                        <!-- Top Quick Grid Cards -->
                        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                            <div onclick="navigateTo('liked')" class="flex items-center bg-spotify-light/60 hover:bg-spotify-light rounded overflow-hidden cursor-pointer transition group relative">
                                <div class="w-20 h-20 bg-gradient-to-br from-indigo-600 to-purple-400 flex items-center justify-center text-white text-2xl shrink-0">
                                    <i class="fa-solid fa-heart"></i>
                                </div>
                                <span class="font-bold px-4">Liked Songs</span>
                                <button class="card-play-btn absolute right-4 w-11 h-11 rounded-full bg-spotify-green text-black flex items-center justify-center shadow-lg hover:scale-105 transition">
                                    <i class="fa-solid fa-play text-lg ml-0.5"></i>
                                </button>

        // Liked Songs View HTML

        // Helper to render reusable Track Row
        function renderTrackRow(track, index) {
            const isLiked = state.likedSongIds.has(track.id);
            const isCurrent = state.activeQueue[state.currentTrackIndex]?.id === track.id;

            return `
                <div onclick="playTrackById('${track.id}')" class="grid grid-cols-12 items-center py-2 px-4 rounded-md hover:bg-spotify-light/50 group cursor-pointer text-sm">
                    <div class="col-span-1 text-spotify-gray group-hover:text-white flex items-center">
                        <span class="group-hover:hidden ${isCurrent ? 'text-spotify-green font-bold' : ''}">${index}</span>
                        <i class="fa-solid fa-play hidden group-hover:inline text-white text-xs"></i>
                    </div>
                    <div class="col-span-6 flex items-center gap-3">
                        <img src="${track.cover}" class="w-10 h-10 rounded object-cover">
                        <div class="overflow-hidden">
                            <div class="font-medium truncate ${isCurrent ? 'text-spotify-green font-bold' : 'text-white'}">${track.title}</div>
                            <div class="text-xs text-spotify-gray truncate">${track.artist}</div>
                        </div>
                    </div>
                    <div class="col-span-4 hidden md:block text-spotify-gray truncate">${track.album}</div>
                    <div class="col-span-1 text-right flex items-center justify-end gap-3 text-spotify-gray">
                        <button onclick="event.stopPropagation(); toggleLike('${track.id}')" class="hover:text-white ${isLiked ? 'text-spotify-green' : 'opacity-0 group-hover:opacity-100'} transition">
                            <i class="${isLiked ? 'fa-solid' : 'fa-regular'} fa-heart"></i>
                        </button>
                        <span>${track.duration}</span>
                    </div>
                </div>
            `;
        }

        // Render Library Items in Left Sidebar
        function renderSidebarLibrary() {
            const container = document.getElementById('library-list');
            container.innerHTML = `
                <div onclick="navigateTo('liked')" class="flex items-center gap-3 p-2 rounded-md hover:bg-spotify-light/60 cursor-pointer group">
                    <div class="w-12 h-12 rounded bg-gradient-to-br from-indigo-600 to-purple-400 flex items-center justify-center text-white shrink-0">
                        <i class="fa-solid fa-heart"></i>
                    </div>
                    <div class="overflow-hidden">
                        <div class="text-sm font-medium text-white truncate">Liked Songs</div>
                        <div class="text-xs text-spotify-gray truncate">Playlist • ${state.likedSongIds.size} songs</div>
                    </div>
                </div>
                ${playlists.map(p => `
                    <div onclick="navigateTo('playlist', true, '${p.id}')" class="flex items-center gap-3 p-2 rounded-md hover:bg-spotify-light/60 cursor-pointer group">
                        <img src="${p.cover}" class="w-12 h-12 rounded object-cover shrink-0">
                        <div class="overflow-hidden">
                            <div class="text-sm font-medium text-white truncate">${p.name}</div>
                            <div class="text-xs text-spotify-gray truncate">Playlist • Spotify</div>
                        </div>
                    </div>
                `).join('')}
            `;
        }

        /* ==========================================
           5. AUDIO PLAYER & CONTROL LOGIC
           ========================================== */

        function playTrackById(trackId) {
            const trackIndex = mockTracks.findIndex(t => t.id === trackId);
            if (trackIndex !== -1) {
                state.activeQueue = [...mockTracks];
                state.currentTrackIndex = trackIndex;
                loadAndPlayTrack();
            }
        }

        function playPlaylist(playlistId) {
            const playlist = playlists.find(p => p.id === playlistId);
            if (playlist && playlist.tracks.length > 0) {
                state.activeQueue = mockTracks.filter(t => playlist.tracks.includes(t.id));
                state.currentTrackIndex = 0;
                loadAndPlayTrack();
            }
        }

        function playLikedSongs() {
            const liked = mockTracks.filter(t => state.likedSongIds.has(t.id));
            if (liked.length > 0) {
                state.activeQueue = liked;
                state.currentTrackIndex = 0;
                loadAndPlayTrack();
            }
        }

        function loadAndPlayTrack() {
            const track = state.activeQueue[state.currentTrackIndex];
            if (!track) return;

            audio.src = track.audioUrl;
            audio.load();
            audio.play().then(() => {
                state.isPlaying = true;
                updatePlayerUI();
            }).catch(err => {
                console.log("Audio play error, falling back:", err);
                showToast("Playing track: " + track.title);
                state.isPlaying = true;
                updatePlayerUI();
            });

            updatePlayerUI();
        }

        function togglePlayPause() {
            if (!audio.src) {
                loadAndPlayTrack();
                return;
            }

            if (state.isPlaying) {
                audio.pause();
                state.isPlaying = false;
            } else {
                audio.play();
                state.isPlaying = true;
            }
            updatePlayerUI();
        }

        function nextTrack() {
            if (state.isShuffle) {
                state.currentTrackIndex = Math.floor(Math.random() * state.activeQueue.length);
            } else {
                state.currentTrackIndex = (state.currentTrackIndex + 1) % state.activeQueue.length;
            }
            loadAndPlayTrack();
        }

        function prevTrack() {
            if (audio.currentTime > 3) {
                audio.currentTime = 0;
            } else {
                state.currentTrackIndex = (state.currentTrackIndex - 1 + state.activeQueue.length) % state.activeQueue.length;
                loadAndPlayTrack();
            }
        }

        function toggleShuffle() {
            state.isShuffle = !state.isShuffle;
            const btn = document.getElementById('shuffle-btn');
            btn.classList.toggle('text-spotify-green', state.isShuffle);
            btn.classList.toggle('text-spotify-gray', !state.isShuffle);
            showToast(state.isShuffle ? 'Shuffle enabled' : 'Shuffle disabled');
        }

        function toggleRepeat() {
            state.isRepeat = !state.isRepeat;
            const btn = document.getElementById('repeat-btn');
            btn.classList.toggle('text-spotify-green', state.isRepeat);
            btn.classList.toggle('text-spotify-gray', !state.isRepeat);
            showToast(state.isRepeat ? 'Repeat enabled' : 'Repeat disabled');
        }

        function toggleMute() {
            state.isMuted = !state.isMuted;
            audio.muted = state.isMuted;
            const btn = document.getElementById('mute-btn');
            btn.innerHTML = state.isMuted 
                ? '<i class="fa-solid fa-volume-xmark text-xs text-spotify-gray"></i>' 
                : '<i class="fa-solid fa-volume-high text-xs text-spotify-gray"></i>';
        }

        function toggleLike(trackId) {
            if (state.likedSongIds.has(trackId)) {
                state.likedSongIds.delete(trackId);
                showToast('Removed from Liked Songs');
            } else {
                state.likedSongIds.add(trackId);
                showToast('Added to Liked Songs');
            }
            
            renderSidebarLibrary();
            // Re-render current page view if needed
            navigateTo(state.currentView, false, state.selectedPlaylistId);
            updatePlayerUI();
        }

        function toggleCurrentSongLike() {
            const currentTrack = state.activeQueue[state.currentTrackIndex];
            if (currentTrack) {
                toggleLike(currentTrack.id);
            }
        }

        /* Update Player Controls & Song Infos */
        function updatePlayerUI() {
            const track = state.activeQueue[state.currentTrackIndex] || mockTracks[0];

            document.getElementById('player-thumb').src = track.cover;
            document.getElementById('player-title').textContent = track.title;
            document.getElementById('player-artist').textContent = track.artist;

            const playPauseBtn = document.getElementById('play-pause-btn');
            playPauseBtn.innerHTML = state.isPlaying 
                ? '<i class="fa-solid fa-pause text-sm"></i>' 
                : '<i class="fa-solid fa-play text-sm ml-0.5"></i>';

            const likeBtn = document.getElementById('player-like-btn');
            const isLiked = state.likedSongIds.has(track.id);
            likeBtn.innerHTML = isLiked 
                ? '<i class="fa-solid fa-heart text-spotify-green"></i>' 
                : '<i class="fa-regular fa-heart"></i>';
        }

        /* Audio Event Listeners Setup */
        function setupAudioEventListeners() {
            audio.addEventListener('timeupdate', () => {
                if (!isNaN(audio.duration)) {
                    const progressPercent = (audio.currentTime / audio.duration) * 100;
                    document.getElementById('progress-bar-fill').style.width = `${progressPercent}%`;
                    document.getElementById('seek-slider').value = progressPercent;
                    document.getElementById('current-time').textContent = formatTime(audio.currentTime);
                    document.getElementById('total-time').textContent = formatTime(audio.duration);
                }
            });

            audio.addEventListener('ended', () => {
                if (state.isRepeat) {
                    audio.currentTime = 0;
                    audio.play();
                } else {
                    nextTrack();
                }
            });
        }

        function setupInputControls() {
            // Seek Slider scrubbing
            const seekSlider = document.getElementById('seek-slider');
            seekSlider.addEventListener('input', (e) => {
                if (audio.duration) {
                    const seekTime = (e.target.value / 100) * audio.duration;
                    audio.currentTime = seekTime;
                }
            });

            // Volume Slider adjustment
            const volumeSlider = document.getElementById('volume-slider');
            volumeSlider.addEventListener('input', (e) => {
                const vol = e.target.value / 100;
                audio.volume = vol;
                state.volume = vol;
                document.getElementById('volume-bar-fill').style.width = `${e.target.value}%`;
            });
        }

        /* Search Filtering Listener */
        function setupSearchInputListener() {
            const searchInput = document.getElementById('search-input');
            const clearBtn = document.getElementById('clear-search');

            searchInput.addEventListener('input', (e) => {
                const query = e.target.value.toLowerCase().trim();
                const resultsSection = document.getElementById('search-results-section');
                const resultsList = document.getElementById('search-results-list');

                if (query.length > 0) {
                    clearBtn.classList.remove('hidden');
                    resultsSection.classList.remove('hidden');

                    const filtered = mockTracks.filter(t => 
                        t.title.toLowerCase().includes(query) || 
                        t.artist.toLowerCase().includes(query) ||
                        t.album.toLowerCase().includes(query)
                    );

                    if (filtered.length > 0) {
                        resultsList.innerHTML = filtered.map((t, i) => renderTrackRow(t, i + 1)).join('');
                    } else {
                        resultsList.innerHTML = `<div class="text-spotify-gray text-sm py-4">No results found for "${query}"</div>`;
                    }
                } else {
                    clearBtn.classList.add('hidden');
                    resultsSection.classList.add('hidden');
                }
            });

            clearBtn.addEventListener('click', () => {
                searchInput.value = '';
                clearBtn.classList.add('hidden');
                document.getElementById('search-results-section').classList.add('hidden');
            });
        }

        /* Playlist Creation Modal Logic */
        function openCreatePlaylistModal() {
            document.getElementById('playlist-modal').classList.remove('hidden');
        }

        function closeCreatePlaylistModal() {
            document.getElementById('playlist-modal').classList.add('hidden');
            document.getElementById('create-playlist-form').reset();
        }

        function handleCreatePlaylist(e) {
            e.preventDefault();
            const name = document.getElementById('playlist-name-input').value;
            const desc = document.getElementById('playlist-desc-input').value;

            const newPlaylist = {
                id: 'p' + (playlists.length + 1),
                name: name,
                description: desc || 'Custom created playlist',
                cover: 'https://images.unsplash.com/photo-1511671782779-c97d3d27a1d4?w=400&h=400&fit=crop',
                tracks: ['t1', 't2']
            };

            playlists.unshift(newPlaylist);
            renderSidebarLibrary();
            closeCreatePlaylistModal();
            showToast(`Playlist "${name}" created!`);
            navigateTo('playlist', true, newPlaylist.id);
        }

        /* Utility Helpers */
        function formatTime(seconds) {
            const mins = Math.floor(seconds / 60);
            const secs = Math.floor(seconds % 60);
            return `${mins}:${secs < 10 ? '0' : ''}${secs}`;
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            document.getElementById('toast-message').textContent = message;
            toast.classList.remove('opacity-0');
            toast.classList.add('opacity-100');
            setTimeout(() => {
                toast.classList.remove('opacity-100');
                toast.classList.add('opacity-0');
            }, 2500);
        }
    </script>
